<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161619"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d586"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d3d44"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle corners -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="url(#border)" stroke-width="16"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Centered AA Monogram (Azhar Ali) -->
  <text x="256" y="325" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="220" font-weight="800" letter-spacing="-6" text-anchor="middle">
    <tspan fill="#fafafa">A</tspan><tspan fill="url(#gold)">A</tspan>
  </text>
</svg>