title: "About us"
seo:
  title: "About Azhar Ali Dar | Accountants in Srinagar"
  description: "Who we are and how we work: Azhar Ali Dar is an independent accountancy firm in Srinagar for small businesses and sole traders."
updatedAt: 2026-10-19
blocks:
  - blockType: hero
    title: "About Azhar Ali Dar"
    lead: "An independent firm that small businesses can talk to."

  - blockType: split
    title: Our story
    body: |
      Tell your firm's story here: when it started, who you work with, and what makes you different. Keep it short and true.

      Readers want to know whether you understand businesses like theirs, so mention the kinds of clients you know best.

  - blockType: steps
    tone: white
    title: How we work with new clients
    steps:
      - title: A free call
        text: We learn about your business and what you need.
      - title: A fixed quote
        text: A written proposal with a monthly fee and what's included.
      - title: A smooth handover
        text: We collect what we need, including from your old accountant.
      - title: Ongoing support
        text: Your accountant is a call or an email away.

  - blockType: section
    tone: tint
    columns: { desktop: 3, tablet: 3, phone: 1 }
    cells:
      - elements:
          - element: counter
            value: "15"
            label: Years in practice
      - elements:
          - element: counter
            value: "200+"
            label: Small businesses we look after
      - elements:
          - element: counter
            value: "1"
            label: Named accountant for each client

  - blockType: section
    columns: { desktop: 2 }
    valign: center
    cells:
      - elements:
          - element: heading
            text: What you can expect
          - element: list
            items:
              - icon: Clock
                text: A reply within one working day
              - icon: FileText
                text: Fixed monthly fees, agreed in writing
              - icon: Calendar
                text: Reminders well before every deadline
      - elements:
          - element: accordion
            items:
              - title: Do you work with sole traders?
                body: Yes. Sole traders and small limited companies are most of our clients.
              - title: Can you take over from my current accountant?
                body: Yes. We ask for what we need from them, with your permission.

  - blockType: cta
    title: Meet the team
    text: The people who will look after your business.
    buttons:
      - label: Our team
        href: /team
      - label: Contact us
        href: /contact
